---
layout: default
---
<article class="article-body">
  <div class="eyebrow">{{ page.category | replace: '-', ' ' | capitalize }} <span class="sep">/</span> {{ page.date | date: '%B %-d, %Y' }}</div>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="article-deck">{{ page.subtitle }}</p>{% endif %}
  <div class="article-rule"></div>
  <div class="prose">{{ content }}</div>
  <p class="back-link"><a href="{{ '/' | relative_url }}">← Back to the archive</a></p>
</article>
