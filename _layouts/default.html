<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="The American Retrospect home">
        <span class="brand-top">Independent historical writing</span>
        <span class="brand-name">The American Retrospect</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ '/studies/' | relative_url }}">Historical Studies</a>
        <a href="{{ '/essays/' | relative_url }}">Essays</a>
        <a href="{{ '/reflections/' | relative_url }}">Reflections</a>
        <a href="{{ '/reading/' | relative_url }}">Reading List</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
  </header>
  <main id="main" class="shell">{{ content }}</main>
  <footer class="site-footer"><div class="shell footer-inner"><span>© {{ 'now' | date: '%Y' }} The American Retrospect</span><span>Independent research · Evidence · Interpretation</span></div></footer>
</body>
</html>
